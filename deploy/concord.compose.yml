# Concord's additions to Stoat's self-hosted compose.yml.
# Never name this compose.override.yml: Stoat's generate_config.sh renames that file on --overwrite.
# Always run compose through ./concord/dc so both files are used.
services:
  # Pin every Stoat service to 0.15.5, the self-hosted support line (commit 9af5e90 pins the same). Stoat's notes say
  # 0.15.6 dual-writes events for testing a new gateway and is not recommended for self-hosters; 0.15.7 is internal.
  #
  # Memory limits (docs/dev-environment.md section 2) stop one runaway service, they are not reservations:
  # their sum exceeds the VPS's 3.7 GB on purpose. A service that hits its limit is OOM-killed and restarted
  # (restart: always). Autumn and January hold in-memory caches of up to 2 GiB and 512 MiB that ignore container
  # limits, which is why they get the largest budgets. Check with: docker inspect -f '{{.State.OOMKilled}}' <container>
  api:
    mem_limit: 192m
    image: ghcr.io/stoatchat/api:v0.15.5
  events:
    mem_limit: 192m
    image: ghcr.io/stoatchat/events:v0.15.5
  autumn:
    mem_limit: 640m
    image: ghcr.io/stoatchat/file-server:v0.15.5
  january:
    mem_limit: 384m
    image: ghcr.io/stoatchat/proxy:v0.15.5
  gifbox:
    mem_limit: 128m
    image: ghcr.io/stoatchat/gifbox:v0.15.5
  crond:
    mem_limit: 128m
    image: ghcr.io/stoatchat/crond:v0.15.5
  pushd:
    mem_limit: 128m
    image: ghcr.io/stoatchat/pushd:v0.15.5
  voice-ingress:
    mem_limit: 128m
    image: ghcr.io/stoatchat/voice-ingress:v0.15.5

  # MongoDB 7.0, not Stoat's mongo:8. Kernels 6.19+ broke TCMalloc, and 8.0.21 to 8.0.29 and 8.3.0 to 8.3.8 refuse to
  # start on them. The fixed 8.0.30+ and 8.3.9+ still refuse Ubuntu's "7.0.0-N" kernels (SERVER-131779), and the images
  # with that fix (8.0.35, 8.3.14) are not on Docker Hub yet. 7.0 has no guard and is supported on every kernel
  # (SERVER-125742). Move to 8.0 once 8.0.35 is published: set featureCompatibilityVersion 7.0, bump the tag, then set 8.0.
  # Never downgrade after 8.0 has run: the data files are not backward compatible.
  # The WiredTiger cache is capped at 0.5 GB (the default is about 1.4 GB here) so the whole stack fits in 3.7 GB.
  database:
    image: docker.io/mongo:7.0.43
    mem_limit: 768m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]

  # Stoat's compose floats these tags. Pinned to the versions first deployed, so a pull never changes them silently.
  # Silo and mc publish only release names, so they are pinned by digest: RELEASE.2026-09-16T00-00-00Z for both.
  # Our Caddyfile replaces Stoat's. Same container path, so this mount wins.
  caddy:
    image: docker.io/caddy:2.11.7
    mem_limit: 128m
    volumes:
      - ./concord/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./concord/spike:/srv/spike:ro

  # Development mail catcher. Web UI on the server's loopback only; reach it with an SSH tunnel.
  # Replaced by a real relay before other people register.
  mailpit:
    image: axllent/mailpit:v1.31.5
    mem_limit: 128m
    restart: always
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "127.0.0.1:8025:8025"

  # Valkey holds only presence, rate limits and voice state, all rebuilt on restart: no persistence.
  # LiveKit shares it. The default noeviction policy stays: a full Valkey fails writes rather than silently
  # dropping LiveKit room state. Idle use is under 5 MB of the 64 MB.
  redis:
    image: docker.io/valkey/valkey:9.1.2-alpine
    mem_limit: 128m
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]

  # RabbitMQ blocks publishers above an absolute watermark instead of 40% of the host's RAM.
  rabbit:
    image: docker.io/rabbitmq:4.3.6
    mem_limit: 384m
    volumes:
      - ./concord/rabbitmq.conf:/etc/rabbitmq/conf.d/90-concord.conf:ro

  minio:
    image: docker.io/pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    mem_limit: 256m

  createbuckets:
    image: docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd

  livekit:
    mem_limit: 256m

  web:
    mem_limit: 128m
