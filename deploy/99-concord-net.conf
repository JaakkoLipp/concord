# Installed to /etc/sysctl.d/ by deploy/server-setup.sh.
# Docker publishes ports on specific addresses (deploy/concord.compose.yml). If an address isn't up yet at boot,
# the floating IPv4 especially, binding it would fail and leave Caddy or LiveKit down. Allow the bind anyway.
net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1
